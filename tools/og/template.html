<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>OG şablonu</title>
<!-- og.py bu sayfayı 1200×630'da render eder. ?kicker=&title=&sub=&m1=&m2=&m3=&url= ile doldurulur. -->
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); position: relative; }
  .frame { position: absolute; inset: 22px; border: 1.5px solid var(--ink); }
  .frame::before { content: ''; position: absolute; inset: 10px; border: .75px solid var(--ink); }
  .box { position: absolute; left: 76px; right: 76px; top: 70px; bottom: 60px; display: flex; flex-direction: column; }
  .kick { font-variant-caps: all-small-caps; letter-spacing: .08em; font-size: 26px; color: var(--mute); }
  h1 { margin-top: 14px; font-size: 70px; line-height: 1.04; letter-spacing: -1.5px; font-weight: 400; max-width: 900px; }
  h1 em { font-style: italic; }
  .sub { margin-top: 20px; font-size: 25px; line-height: 1.45; color: var(--ink-2); max-width: 820px; }
  .dimline { margin-top: auto; max-width: 640px; font-size: 17px; height: 40px; }
  .dimline::before { top: 27px; }
  .dimline::after { top: 22.5px; }
  .tb { position: absolute; right: 22px; bottom: 22px; width: 380px; display: grid; grid-template-columns: 1.6fr 1fr; border: 1.5px solid var(--ink); background: var(--bg); font: 400 14px/1.3 var(--mono); }
  .tb div { border: .5px solid var(--ink); padding: 6px 10px; }
  .tb small { display: block; font: 500 12px var(--cond); letter-spacing: 1.2px; color: var(--mute); }
  .tb strong { font: 500 22px/1.05 var(--cond); letter-spacing: .5px; }
  .tb .wide { grid-column: span 2; }
</style>
</head>
<body>
<div class="frame"></div>
<div class="box">
  <div class="kick" id="kicker">İmalat mühendisliği · Bursa ve Ankara</div>
  <h1 id="title">Üretim verisini okuyan, <em>ölçen</em> ve araca çeviren bir mühendis.</h1>
  <div class="sub" id="sub"></div>
  <div class="dimline"><span id="metrics">776 test · 8 açık kaynak depo · 2 canlı demo</span></div>
</div>
<div class="tb">
  <div><small>AD SOYAD</small><strong>İSMAİL BİLGEHAN KAZANCI</strong></div>
  <div><small>PAFTA</small><span id="sheet">01</span></div>
  <div class="wide"><small>ADRES</small><span id="url">dailydana.github.io</span></div>
</div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var set = function (id, v, html) { var el = document.getElementById(id); if (el && v != null) { if (html) el.innerHTML = v; else el.textContent = v; } };
    var esc = function (s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
    if (q.get('kicker')) set('kicker', q.get('kicker'));
    // başlıkta *kelime* italik olur
    if (q.get('title')) set('title', esc(q.get('title')).replace(/\*([^*]+)\*/g, '<em>$1</em>'), true);
    if (q.get('sub')) set('sub', q.get('sub'));
    if (q.get('url')) set('url', q.get('url'));
    if (q.get('sheet')) set('sheet', q.get('sheet'));
    var ms = ['m1', 'm2', 'm3'].map(function (k) { return q.get(k); }).filter(Boolean);
    if (ms.length) set('metrics', ms.join(' · '));
  })();
</script>
</body>
</html>
